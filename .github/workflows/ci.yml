name: ci
on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc g++ clang time
      - name: release compiler
        run: cargo build --release
      - name: fast gates
        run: ./verify.sh -Fast
      - name: benchmarks
        run: ./bench-linux.sh
      - name: memory bounds
        run: ./bench-memory.sh
